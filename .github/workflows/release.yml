# Whenever a version tag like v0.1.0 is pushed, builds a universal (Apple
# Silicon + Intel) macOS binary and static Linux binaries (x86_64 + arm64),
# publishes them as a GitHub release, then points the Homebrew formula in
# Gus-Eisen/homebrew-tap at the new macOS release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust target
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup update stable
          rustup default stable
          rustup target add "$TARGET"

      - name: Test
        run: cargo test --locked

      # musl gives a fully static binary that runs on any distro.
      - name: Build
        run: cargo build --locked --release --target "$TARGET"

      - name: Package
        run: |
          tar -czf ringer-linux-${{ matrix.arch }}.tar.gz -C "target/$TARGET/release" ringer
          sha256sum ringer-linux-${{ matrix.arch }}.tar.gz > ringer-linux-${{ matrix.arch }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: ringer-linux-*

  release:
    needs: linux
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust targets
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Test
        run: cargo test --locked

      - name: Build
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin

      - name: Package universal binary
        run: |
          mkdir dist
          lipo -create -output dist/ringer \
            target/aarch64-apple-darwin/release/ringer \
            target/x86_64-apple-darwin/release/ringer
          lipo -info dist/ringer
          tar -czf ringer-macos.tar.gz -C dist ringer
          shasum -a 256 ringer-macos.tar.gz > ringer-macos.tar.gz.sha256

      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ringer-macos.tar.gz ringer-macos.tar.gz.sha256 \
            ringer-linux-*.tar.gz ringer-linux-*.tar.gz.sha256 \
            --title "ringer $GITHUB_REF_NAME" \
            --generate-notes

      # Needs a HOMEBREW_TAP_TOKEN secret: a fine-grained token with
      # Contents read/write access to Gus-Eisen/homebrew-tap only.
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN isn't set, so the Homebrew formula wasn't updated."
            exit 0
          fi
          # Pasted tokens sometimes pick up a stray newline or space.
          TAP_TOKEN=$(printf '%s' "$TAP_TOKEN" | tr -d '[:space:]')
          sha=$(cut -d' ' -f1 ringer-macos.tar.gz.sha256)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/ringer-macos.tar.gz"
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/Gus-Eisen/homebrew-tap.git" tap
          cd tap
          sed -i '' -e "s|^  url \".*\"|  url \"$url\"|" -e "s|^  sha256 \".*\"|  sha256 \"$sha\"|" Formula/ringer.rb
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ringer ${GITHUB_REF_NAME#v}"
          git push
