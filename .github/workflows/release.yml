# Builds a universal (Apple Silicon + Intel) macOS binary and publishes it as
# a GitHub release whenever a version tag like v0.1.0 is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust targets
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Test
        run: cargo test --locked

      - name: Build
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin

      - name: Package universal binary
        run: |
          mkdir dist
          lipo -create -output dist/rust-timer \
            target/aarch64-apple-darwin/release/rust-timer \
            target/x86_64-apple-darwin/release/rust-timer
          lipo -info dist/rust-timer
          tar -czf rust-timer-macos.tar.gz -C dist rust-timer
          shasum -a 256 rust-timer-macos.tar.gz > rust-timer-macos.tar.gz.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            rust-timer-macos.tar.gz rust-timer-macos.tar.gz.sha256 \
            --title "rust-timer $GITHUB_REF_NAME" \
            --generate-notes
